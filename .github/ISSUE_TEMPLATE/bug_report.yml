name: Bug report
description: Report a reproducible problem in Chrono Study
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. Please give as much detail as you can.
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what went wrong.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to '...'
        2. Tap on '...'
        3. Observe '...'
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: input
    id: app-version
    attributes:
      label: Chrono Study version
      placeholder: e.g. 0.1.0
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device & Android version
      placeholder: e.g. Pixel 7, Android 14
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / screenshots
      description: Paste relevant logcat output or attach screenshots.
    validations:
      required: false

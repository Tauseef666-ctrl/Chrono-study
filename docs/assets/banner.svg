<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-label="Chrono Study">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0B0C0F"/>
      <stop offset="1" stop-color="#000000"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFC766"/>
      <stop offset="1" stop-color="#FF8A00"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1280" height="360" rx="0" fill="url(#bg)"/>
  <rect x="0" y="356" width="1280" height="4" fill="url(#ring)" opacity="0.55"/>

  <g transform="translate(120 60)">
    <circle cx="120" cy="120" r="104" fill="none" stroke="#1A1D23" stroke-width="12"/>
    <circle cx="120" cy="120" r="104" fill="none" stroke="url(#ring)" stroke-width="12"
            stroke-linecap="round" stroke-dasharray="490 163" transform="rotate(-90 120 120)" filter="url(#glow)"/>
    <g stroke="#3E444E" stroke-width="5" stroke-linecap="round">
      <line x1="120" y1="30" x2="120" y2="44"/>
      <line x1="120" y1="196" x2="120" y2="210"/>
      <line x1="30" y1="120" x2="44" y2="120"/>
      <line x1="196" y1="120" x2="210" y2="120"/>
    </g>
    <g stroke="#F4F6F8" stroke-width="12" stroke-linecap="round" filter="url(#glow)">
      <line x1="120" y1="120" x2="120" y2="62"/>
      <line x1="120" y1="120" x2="166" y2="146"/>
    </g>
    <circle cx="120" cy="120" r="11" fill="#FFB020"/>
  </g>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="410" y="168" fill="#F4F6F8" font-size="86" font-weight="700" letter-spacing="6">CHRONO STUDY</text>
    <text x="414" y="226" fill="#FFB020" font-size="30" font-weight="600" letter-spacing="10">PLAN  •  FOCUS  •  ACHIEVE</text>
    <text x="416" y="270" fill="#8A9099" font-size="21" font-weight="400">Premium digital clock, screensaver &amp; focus timer for students</text>
    <text x="416" y="320" fill="#5C626B" font-size="18" font-weight="500" letter-spacing="2">ANDROID  ·  KOTLIN  ·  JETPACK COMPOSE  ·  MATERIAL 3</text>
  </g>
</svg>
